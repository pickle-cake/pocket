name: Feedback
description: A problem, an idea, or something that works well
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. Everything you write here is public, so leave out anything you would rather keep private, or email pocket@mndlss.com instead.

        Coming from Send feedback in Pocket's Help? It fills in the message, the version and, if you ticked it, the device and timing details.
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - A problem
        - An idea
        - Something that works well
      default: 0
    validations:
      required: true
  - type: textarea
    id: message
    attributes:
      label: Message
      description: For a problem, say what you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Pocket version
      description: Shown beside the title in the app.
      placeholder: 1.5.239
  - type: textarea
    id: details
    attributes:
      label: Device and timing details
      description: The app version, browser, screen and the timing of your last runs. Optional.
      render: text
